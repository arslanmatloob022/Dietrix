# Dietrix canonical URL and static SSG routing.
#
# dietrixfit.com is the canonical domain. dietrix.fit is a retired domain
# that permanently 301-redirects everything to the equivalent dietrixfit.com
# URL — this preserves whatever indexing/authority dietrix.fit had built up
# instead of starting from zero on the new domain.
#
# Before deployment, confirm that:
# - the root points at the active Vite SSG dist directory;
# - the TLS certificate for the canonical host covers both dietrixfit.com
#   and www.dietrixfit.com;
# - the TLS certificate for the retired host (dietrix.fit / www.dietrix.fit)
#   is kept valid and auto-renewing for as long as this redirect stays in
#   place — an HTTPS redirect still requires a successful TLS handshake on
#   the domain being redirected FROM, so letting that certificate expire
#   breaks the redirect with a certificate error before nginx ever runs.

# HTTP variants of every hostname go directly to HTTPS + canonical apex +
# no trailing slash. The redirect target is identical regardless of which
# host/protocol variant was requested, so one block covers all of them.
server {
    listen 80;
    listen [::]:80;
    server_name dietrixfit.com www.dietrixfit.com dietrix.fit www.dietrix.fit;

    location = / {
        return 301 https://dietrixfit.com/$is_args$args;
    }

    location ~ ^(?<canonical_path>.+)/$ {
        return 301 https://dietrixfit.com$canonical_path$is_args$args;
    }

    location / {
        return 301 https://dietrixfit.com$uri$is_args$args;
    }
}

# HTTPS www.dietrixfit.com goes directly to the apex host and removes a
# trailing slash.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dietrixfit.com;

    ssl_certificate /etc/letsencrypt/live/dietrixfit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dietrixfit.com/privkey.pem;

    location = / {
        return 301 https://dietrixfit.com/$is_args$args;
    }

    location ~ ^(?<canonical_path>.+)/$ {
        return 301 https://dietrixfit.com$canonical_path$is_args$args;
    }

    location / {
        return 301 https://dietrixfit.com$uri$is_args$args;
    }
}

# HTTPS dietrix.fit and www.dietrix.fit — the retired domain. Permanently
# redirect every URL to its equivalent on dietrixfit.com. Uses the OLD
# domain's own certificate (not dietrixfit.com's) since the TLS handshake
# happens against whichever hostname was actually requested.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dietrix.fit www.dietrix.fit;

    ssl_certificate /etc/letsencrypt/live/dietrix.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dietrix.fit/privkey.pem;

    location ~ ^(?<canonical_path>.+)/$ {
        return 301 https://dietrixfit.com$canonical_path$is_args$args;
    }

    location / {
        return 301 https://dietrixfit.com$uri$is_args$args;
    }
}

# Canonical origin: HTTPS, apex host, and no trailing slash except for root.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dietrixfit.com;

    root /var/www/dietrix/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/dietrixfit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dietrixfit.com/privkey.pem;

    # Security headers. This file is the actual production config (not
    # netlify.toml, which has no effect since the host is self-managed
    # nginx) — these must live here to have any real effect.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Keep this redirect above the static-file handler. $is_args$args preserves
    # the original query string without adding a second redirect hop.
    location ~ ^(?<canonical_path>.+)/$ {
        return 301 https://dietrixfit.com$canonical_path$is_args$args;
    }

    location = / {
        try_files /index.html =404;
    }

    # /404 is a real error response even when requested directly.
    location = /404 {
        return 404;
    }

    # The system mime.types file has no .webmanifest mapping, so it would
    # otherwise fall back to application/octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Nginx reaches this location only through error_page processing.
    location = /404/index.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # Vite SSG writes /about/index.html, /testimonials/index.html, etc.
    # Checking the nested file first serves /about with 200 and avoids Nginx's
    # automatic directory-slash redirect. There is intentionally no SPA
    # fallback to /index.html.
    location / {
        try_files $uri/index.html $uri =404;
    }

    error_page 404 /404/index.html;
}
