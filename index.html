<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Preconnect to speed up external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Fonts: preloaded as a stylesheet link (not a CSS @import) so the browser
         discovers them on initial HTML parse instead of after style.css loads -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://dietrix.fit/" />
    <link rel="alternate" hreflang="en" href="https://dietrix.fit/" />
    <link rel="alternate" hreflang="x-default" href="https://dietrix.fit/" />
    <link rel="sitemap" type="application/xml" href="/sitemap_index.xml" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="theme-color" content="#047857" />
    <meta name="application-name" content="Dietrix Fit" />
    <meta name="apple-mobile-web-app-title" content="Dietrix Fit" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary SEO -->
    <title>Online Nutritionist Pakistan, USA, UK | Dietrix Fit</title>
    <meta
      name="description"
      content="Get a personalized diet plan from a certified nutritionist, 100% online. Real results for weight loss, PCOS, and diabetes — trusted by 1,800+ clients worldwide."
    />
    <meta name="author" content="Dn. Rimsha Naseer, Dietrix Fit" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dietrix Fit" />
    <meta
      property="og:title"
      content="Online Nutritionist Pakistan, USA, UK & Global | Dietrix Fit"
    />
    <meta
      property="og:description"
      content="Evidence-based 1-on-1 nutrition coaching for fat loss, PCOS, diabetes, and gut health — from anywhere in the world. 1,800+ clients across 14 countries."
    />
    <meta property="og:url" content="https://dietrix.fit/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://dietrix.fit/media/dietrix-social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@dietrixfit" />
    <meta
      name="twitter:title"
      content="Online Nutritionist Pakistan, USA, UK | Dietrix Fit"
    />
    <meta
      name="twitter:description"
      content="1-on-1 evidence-based nutrition coaching for fat loss, PCOS, diabetes, and gut health. Clients in 14 countries. Book your free consultation today."
    />
    <meta name="twitter:image" content="https://dietrix.fit/media/dietrix-social-card.png" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="PK" />
    <meta name="geo.placename" content="Pakistan" />

    <!-- Structured data: Organization (inline for SSG pages that override it) -->
    <script type="application/ld+json" id="dietrix-organization-schema">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "@id": "https://dietrix.fit/#organization",
        "name": "Dietrix Fit",
        "url": "https://dietrix.fit",
        "email": "rimshanaseer101@gmail.com",
        "logo": "https://dietrix.fit/brand/dietrix-fit-organization-logo-512.png",
        "description": "Evidence-based online nutrition coaching for weight loss, PCOS, diabetes, gut health, and performance, serving clients globally.",
        "medicalSpecialty": [
          "Nutrition",
          "Dietitian",
          "Weight Loss",
          "PCOS",
          "Diabetes"
        ],
        "areaServed": [
          "Worldwide",
          "Pakistan",
          "United Kingdom",
          "United States",
          "Canada",
          "Germany",

          "Australia"

        "founder": {
          "@type": "Person",
          "name": "Dn. Rimsha Naseer",
          "jobTitle": "Certified Clinical Nutritionist",
          "url": "https://dietrix.fit/about"
        },
        "sameAs": []
      }

    <meta
      name="google-site-verification"
      content="e6cVShHwlr2TpP_LvC9__RYpz7DP2eJZXtQL2chh4Vw"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
